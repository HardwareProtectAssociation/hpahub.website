services:
  app:
    environment:
      HPA_LOCAL_TEST: "1"
    build:
      labels:
        org.hpahub.local-image: "true"
    ports: !override []
    networks: !override
      - isolated

  proxy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_started
        restart: true
    ports:
      - "127.0.0.1:${PORT:-18764}:8090"
    networks:
      - default
      - isolated
    command: ["caddy", "reverse-proxy", "--from", ":8090", "--to", "app:8090"]

networks:
  isolated:
    internal: true
